/* ===== theme 2: the sticker look on every page ===== */
:root{--cr:#f6f1e7;--ink:#14110f;--ln:#3a3a44}
body{background:#08090e;color:var(--cr)}
h1,h2,h3{font-family:"Archivo Black",Impact,"Arial Black",sans-serif;font-style:normal;font-weight:400;letter-spacing:-1px}
.sub{color:#b6b0a2}
/* header */
.np{background:#08090e;border:3px solid var(--cr);border-radius:12px;box-shadow:4px 4px 0 var(--cr);padding:5px;gap:3px}
.np a{font:400 11px "Archivo Black",Impact,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--cr);border-radius:7px;border:0;padding:9px 12px}
.np a:hover{background:#1c1c24}.np a.b{background:#ff9f45;color:var(--ink)}.np a.g{background:#5ee6b0;color:var(--ink);border-radius:7px}.np a.c{background:#66d2ff;color:var(--ink);border-radius:7px}.np .sep{background:#3a3a44}
.bk{background:#08090e;border:3px solid var(--cr);border-radius:10px;box-shadow:4px 4px 0 var(--cr);font:400 11px "Archivo Black",Impact,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--cr);padding:10px 14px}
.wm{font:400 20px "Archivo Black",Impact,sans-serif;font-style:normal;letter-spacing:-.5px;text-shadow:none;color:var(--cr)}
.lg i{filter:none}
/* titles, inputs, chips */
.ttl small{font:700 12px Inter;letter-spacing:2px;color:#8a8478}
.srch input,.ctl input,.ctl select,.bset select,.bset input,.tmm input,.bctl select,.srch select{background:#0b0c11;border:3px solid var(--cr);border-radius:10px;color:var(--cr)}
.fbn{background:#0b0c11;border:3px solid var(--cr);border-radius:10px;box-shadow:4px 4px 0 var(--cr);color:var(--cr)}
.chip,.tab button{background:#0b0c11;border:2px solid var(--cr);color:var(--cr);border-radius:8px;font:400 12px "Archivo Black",Impact,sans-serif;letter-spacing:.3px;text-transform:uppercase;padding:8px 14px;box-shadow:3px 3px 0 var(--cr);transition:transform .12s,box-shadow .12s}
.chip:hover,.tab button:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--cr)}.chip.on,.tab button.on{background:#ff9f45;color:var(--ink);border-color:var(--cr)}
.tab button.on{background:#5ee6b0}.lang{gap:12px}
.eh{font:400 13px "Archivo Black",Impact,sans-serif;color:var(--cr);letter-spacing:2px}.eh i{height:0;background:none;border-top:3px dashed #3a3a44}.eh span{font:700 12px Inter;color:#8a8478}
/* set tiles and card tiles */
.st{background:hsl(var(--h) 78% 74%);color:var(--ink);border:3px solid var(--cr);border-radius:12px;box-shadow:5px 5px 0 var(--cr);transition:transform .12s,box-shadow .12s;min-height:104px}

.cdb{background:var(--cr);color:var(--ink);border:2px solid var(--ink);border-radius:6px;font:400 12px "Archivo Black",Impact,sans-serif}
.nw2{background:var(--ink);color:#ffd23f;border:0;border-radius:5px;font:400 10px "Archivo Black",Impact,sans-serif}

.cd b{font:700 13px Inter}.cam{background:var(--cr);color:var(--ink)}.cn,.ckh .cn{font:400 14px "Archivo Black",Impact,sans-serif}
/* buttons */
.bg2 button,.bg2 a{border:3px solid var(--cr);border-radius:10px;box-shadow:4px 4px 0 var(--cr);font:400 13px "Archivo Black",Impact,sans-serif;letter-spacing:.5px;text-transform:uppercase;transition:transform .12s,box-shadow .12s}

.o1{background:#ff9f45;color:var(--ink)}.o2{background:#66d2ff;color:var(--ink)}.o3{background:#b79cff;color:var(--ink)}.o4{background:#5ee6b0;color:var(--ink)}.bg2 .o5{background:#0b0c11;color:var(--cr);font-size:11px}
